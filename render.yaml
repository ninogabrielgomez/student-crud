services:
  # 🌐 Backend (Spring Boot Docker) 🌐
  - type: web
    name: student-backend
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: student-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: student-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: student-db
          property: database
      - key: DATABASE_USERNAME
        fromDatabase:
          name: student-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: student-db
          property: password
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: DB_SSL_MODE
        value: require
      - key: PORT
        value: "8080"

  # 🌐 Frontend (React + Vite Static Site) 🌐
  - type: web
    name: student-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Note: After first deploy, verify this matches your actual Render backend URL
      - key: VITE_API_BASE_URL
        value: https://student-backend.onrender.com

databases:
  # 🗄️ PostgreSQL Database 🗄️
  - name: student-db
    plan: free
    databaseName: db_student
